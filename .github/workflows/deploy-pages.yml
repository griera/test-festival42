# Publishes only the files the static site needs to GitHub Pages.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Deploy only when something that is published changes (README, scripts, data sources... do not trigger it)
    paths:
      - 'index.html'
      - '404.html'
      - 'robots.txt'
      - 'app.js'
      - 'sw.js'
      - 'styles.css'
      - 'data.json'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
      - 'package.json'
      - 'package-lock.json'
  # Manual run from the Actions tab
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what it needs
permissions:
  contents: read

# One deployment at a time; a running deployment is never cancelled halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Stops the deployment if index.html and sw.js reference different versions
      - name: Check version alignment
        run: python3 scripts/bump_version.py check

      # Minifiers pinned in package.json / package-lock.json (installed with integrity checks)
      - name: Install build tools
        run: npm ci --no-audit --no-fund

      # Allowlist: only these files end up on the website. A missing file makes the job fail.
      - name: Collect site files
        run: |
          set -euo pipefail
          mkdir _site
          cp index.html 404.html robots.txt app.js sw.js styles.css data.json _site/
          cp -r assets _site/assets

      # Only the published copies are minified: the repository keeps the readable, commented sources.
      # styles.css is already minified by the Tailwind CLI; covers are already compressed WebP.
      - name: Minify JS, HTML and JSON
        run: |
          set -euo pipefail
          npx --no-install esbuild app.js --minify --outfile=_site/app.js --log-level=warning
          npx --no-install esbuild sw.js --minify --outfile=_site/sw.js --log-level=warning
          for page in index.html 404.html; do
            npx --no-install html-minifier-terser --collapse-whitespace --conservative-collapse \
              --remove-comments -o "_site/$page" "$page"
          done
          # Compact JSON; also stops the deployment if data.json is not valid JSON
          python3 -c "import json; json.dump(json.load(open('data.json', encoding='utf-8')), open('_site/data.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))"
          # Sanity checks on the minified output
          node --check _site/app.js
          node --check _site/sw.js
          grep -q 'id="dataPreload"' _site/index.html

      # Summary, then the full list in a collapsible group of the log.
      # No 'head' in pipes: closing a pipe early makes the writer fail, and pipefail would stop the job.
      - name: List published files
        run: |
          set -euo pipefail
          echo "Top-level files:"
          find _site -maxdepth 1 -type f -printf '  %-12f %6s bytes\n' | sort
          echo "Covers (.webp): $(find _site/assets -type f -name '*.webp' | wc -l)"
          echo "Total: $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"
          echo "::group::All published files"
          find _site -type f | sort | sed 's|^_site/||'
          echo "::endgroup::"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

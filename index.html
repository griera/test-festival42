<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival 42 - Festival Gèneres Fantàstics de Barcelona</title>
    <!-- Crawler access rules definition -->
    <meta name="robots" content="noindex, nofollow">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-indigo-950 border-b border-indigo-900 text-white shadow-lg py-8 px-4">
        <div class="max-w-4xl mx-auto text-center">
            <span class="bg-indigo-600 text-indigo-100 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Edició 2026</span>
            <h1 class="text-4xl font-extrabold tracking-tight mt-2 text-white">Festival 42</h1>
            <p class="text-indigo-300 font-medium text-lg mt-1">Festival Gèneres Fantàstics de Barcelona</p>

            <div class="mt-4 flex flex-wrap justify-center gap-4 text-sm text-slate-300">
                <p>📅 <strong>Dates:</strong> 4-8 de novembre de 2026</p>
                <p>📍 <strong>Lloc:</strong> <a href="https://www.barcelona.cat/fabraicoats/ca" target="_blank" class="underline hover:text-indigo-400">Fabra i Coats</a></p>
                <p>🌐 <strong>Web oficial:</strong> <a href="https://www.barcelona.cat/festival42/ca" target="_blank" class="underline hover:text-indigo-400">Festival 42</a></p>
            </div>
        </div>
    </header>

    <!-- Main Search & Content Section -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow my-6">

        <!-- Search Bar -->
        <div class="relative mb-8">
            <input
                type="text"
                id="searchInput"
                placeholder="Cerca per Títol, Autor/a, Editorial, Distribuïdor, EAN i Horaris"
                class="w-full p-4 pl-12 rounded-xl border border-slate-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-slate-800 text-white text-lg transition-all placeholder-slate-400"
                oninput="handleSearch()"
            >
            <span class="absolute left-4 top-4 text-slate-400 text-xl">🔍</span>
        </div>

        <!-- Type Filter Chips -->
        <div class="flex flex-wrap justify-center gap-2 mt-4" id="typeFilterContainer">
            <button onclick="setTypeFilter('all')" id="btn-filter-all" class="type-filter-btn active-filter px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-slate-100 text-slate-900 border-white shadow-sm">
                Tots
            </button>
            <button onclick="setTypeFilter('book')" id="btn-filter-book" class="type-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700">
                📚 Llibres
            </button>
            <button onclick="setTypeFilter('talk')" id="btn-filter-talk" class="type-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700">
                🎤 Xerrades
            </button>
            <button onclick="setTypeFilter('signing')" id="btn-filter-signing" class="type-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700">
                ✍️ Signatures
            </button>
        </div>

        <!-- Day Filter Chips (dynamically generated) -->
        <div class="flex flex-wrap justify-center gap-2 mt-6" id="dayFilterContainer">
            <button onclick="setDayFilter('all')" id="btn-day-all" class="day-filter-btn active-filter px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-slate-100 text-slate-900 border-white shadow-sm">
                Tots els dies
            </button>
        </div>

        <!-- Loading State -->
        <div id="loadingIndicator" class="text-center py-12 text-slate-400">
            Carregant el catàleg del festival...
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="space-y-6 hidden mt-6">
            <!-- Dynamic results will be injected here via JavaScript -->
        </div>

    </main>

    <!-- Scroll to Top Floating Button -->
    <button onclick="scrollToTop()" id="scrollToTopBtn" class="fixed bottom-6 right-6 z-50 hidden bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-full shadow-lg border border-indigo-500 transition-all cursor-pointer items-center justify-center" aria-label="Tornar a dalt">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
        </svg>
    </button>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 text-center py-6 text-sm border-t border-slate-800 px-4">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>
                <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs px-2 py-0.5 rounded-full font-semibold uppercase mr-2">Prototip de proves</span>
                Festival 42 (Edició de prova)
            </p>
            <p class="text-slate-500 text-xs">
                Codi obert sota llicència
                <a href="https://opensource.org/licenses/MIT" target="_blank" class="underline hover:text-indigo-400">MIT</a>.
                Repositori a <a href="https://github.com/griera/test-festival42" target="_blank" class="underline hover:text-indigo-400">GitHub</a>.
            </p>
        </div>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>

        // ==========================================
        // GLOBAL APPLICATION STATE
        // ==========================================

        // Stores main application records
        let fairData = [];

        // Controls the initial and progressive book display limit (Result Capping for INP performance optimization)
        let visibleBooksLimit = 50;

        // Stores the latest search or filter results to preserve state when loading more items
        let lastFilteredData = [];

        // Timer reference used for the search input debounce delay (prevents main thread blocking while typing)
        let searchTimeout = null;

        // Active type filter setting: 'all', 'book', 'talk', or 'signing'
        let currentTypeFilter = 'all';

        // Active day filter setting
        let currentDayFilter = 'all';

        // Fetch JSON data asynchronously when the page loads and securely load initial URL search/filters
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Network response was not ok');
                fairData = await response.json();

                // Hide loading and show results container
                document.getElementById('loadingIndicator').classList.add('hidden');
                document.getElementById('resultsContainer').classList.remove('hidden');

                // Read URL location parameters
                const urlParams = new URLSearchParams(window.location.search);
                const initialQuery = urlParams.get('search');
                const initialType = urlParams.get('type');

                // Apply initial type filter if valid
                if (initialType && ['book', 'talk', 'signing'].includes(initialType)) {
                    setTypeFilter(initialType);
                }

                // Programmatically generate date filter controls from configuration
                const dayContainer = document.getElementById('dayFilterContainer');
                eventDaysList.forEach(dayCode => {
                    const label = formatDayLabel(dayCode);

                    const btn = document.createElement('button');
                    btn.onclick = () => setDayFilter(dayCode);
                    btn.id = `btn-day-${dayCode}`;
                    btn.className = 'day-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700';
                    btn.textContent = label;

                    dayContainer.appendChild(btn);
                });

                // Load initial search parameters (.value is safe against XSS)
                if (initialQuery) {
                    document.getElementById('searchInput').value = initialQuery;
                }

                // Run initial search/render matching URL state
                executeSearch();

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loadingIndicator').innerHTML = `
                    <p class="text-red-400">Error al carregar el fitxer de dades (data.json). Assegura't de pujar-lo al mateix directori.</p>
                `;
            }
        });

        // Show or hide the "Scroll to Top" button based on window vertical scroll position
        window.addEventListener('scroll', () => {
            const scrollBtn = document.getElementById('scrollToTopBtn');
            if (window.scrollY > 300) {
                scrollBtn.classList.remove('hidden');
                scrollBtn.classList.add('flex');
            } else {
                scrollBtn.classList.add('hidden');
                scrollBtn.classList.remove('flex');
            }
        });

        // Smooth scroll window back to top
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // Utility function to return '-' if a field is null, undefined, or empty string, but allowing 0 and 0.0
        function safeValue(val) {
            if (val === null || val === undefined || val === 'null' || val === '') {
                return '-';
            }
            if (typeof val === 'string' && val.trim() === '') {
                return '-';
            }
            return val;
        }

        // Utility function to sanitize input strings before rendering
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Updates active type filter and re-runs the search filtering
        function setTypeFilter(type) {
            currentTypeFilter = type;
            visibleBooksLimit = 50; // Reset limit when switching filter

            // Update UI button styles
            const buttons = ['all', 'book', 'talk', 'signing'];
            buttons.forEach(t => {
                const btn = document.getElementById(`btn-filter-${t}`);
                if (btn) {
                    if (t === type) {
                        if (t === 'all') {
                            btn.className = 'type-filter-btn active-filter px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-slate-100 text-slate-900 border-white shadow-sm';
                        } else if (t === 'book') {
                            btn.className = 'type-filter-btn active-filter px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-indigo-600 text-white border-indigo-500';
			} else if (t === 'talk') {
                            btn.className = 'type-filter-btn active-filter px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-teal-600 text-white border-teal-500';
                        } else if (t === 'signing') {
                            btn.className = 'type-filter-btn active-filter px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-amber-600 text-white border-amber-500';
                        }
                    } else {
                        btn.className = 'type-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700';
                    }
                }
            });

            executeSearch();
        }

        // Configured event dates array for dynamic selector rendering
        const eventDaysList = ['04112026', '05112026', '06112026', '07112026', '08112026'];

        // Utility function to resolve localized display labels from standard date inputs
        function formatDayLabel(dayCode) {
            const day = dayCode.substring(0, 2);
            const month = dayCode.substring(2, 4);
            const year = dayCode.substring(4, 8);

            // Construct standard ISO date format string for Date parsing
            const date = new Date(`${year}-${month}-${day}`);

            // Localized weekday abbreviations index mapping
            const weekdays = ['Dg', 'Dl', 'Dm', 'Dc', 'Dj', 'Dv', 'Ds'];

            // Localized month name abbreviations index mapping (1-indexed for direct matching)
            const months = ['', 'Gen', 'Feb', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Oct', 'Nov', 'Des'];

            const weekday = weekdays[date.getDay()];
            const monthName = months[parseInt(month, 10)];

            return `${weekday} ${day} ${monthName}`;
        }

        // Convert compact date representations into standard delimiter format for query matching
        function formatDayString(dayCode) {
            if (!dayCode || dayCode === 'all') return 'all';
            return `${dayCode.substring(0, 2)}/${dayCode.substring(2, 4)}/${dayCode.substring(4)}`;
        }

        // Updates active day filter and re-runs the search filtering
        function setDayFilter(dayCode) {
            currentDayFilter = dayCode;
            visibleBooksLimit = 50; // Reset limit when switching filter

            const days = ['all', ...eventDaysList];
            days.forEach(d => {
                const btn = document.getElementById(`btn-day-${d}`);
                if (btn) {
                    if (d === dayCode) {
                        if (d === 'all') {
                            btn.className = 'day-filter-btn active-filter px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-slate-100 text-slate-900 border-white shadow-sm';
                        } else {
                            btn.className = 'day-filter-btn active-filter px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-blue-700 text-white border-blue-500 shadow-sm';
                        }
                    } else {
                        btn.className = 'day-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold border transition-colors cursor-pointer bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700';
                    }
                }
            });

            executeSearch();
        }

        // Modify address bar state dynamically without page refresh
        function updateUrlParams(query, type) {
            const url = new URL(window.location);

            if (query && query.trim() !== '') {
                url.searchParams.set('search', query);
            } else {
                url.searchParams.delete('search');
            }

            if (type && type !== 'all') {
                url.searchParams.set('type', type);
            } else {
                url.searchParams.delete('type');
            }

            window.history.replaceState({}, '', url);
        }

	// Core search logic combining filters, text search, and secure URL persistence
        // When typing in search, reset the limit back to 50
        function executeSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            let results = fairData;

            // Apply category selection criteria
            if (currentTypeFilter !== 'all') {
                results = results.filter(item => item.type === currentTypeFilter);
            }

            if (currentDayFilter !== 'all') {
                const targetDate = formatDayString(currentDayFilter);
                results = results.filter(item => {
                    const matchDatetime = item.datetime && item.datetime.includes(targetDate);
                    const matchSchedule = item.schedule && item.schedule.includes(targetDate);
                    return matchDatetime || matchSchedule;
                });
            }

            // Apply text search criteria if available
            if (query !== '') {
                results = results.filter(item => {
                    const matchTitle = item.title && item.title.toLowerCase().includes(query);
                    const matchAuthor = item.author && item.author.toLowerCase().includes(query);
                    const matchPublisher = item.publisher && item.publisher.toLowerCase().includes(query);
                    const matchDistributor = item.distributor && item.distributor.toLowerCase().includes(query);
                    const matchEan = item.ean && item.ean.toLowerCase().includes(query);
                    const matchLocation = item.location && item.location.toLowerCase().includes(query);
                    const matchDatetime = item.datetime && item.datetime.toLowerCase().includes(query);
                    const matchSchedule = item.schedule && item.schedule.toLowerCase().includes(query);

                    return matchTitle || matchAuthor || matchPublisher || matchDistributor || matchEan || matchLocation || matchDatetime || matchSchedule;
                });
            }

            lastFilteredData = results;

            // Sync state to URL parameters securely (persistence)
            updateUrlParams(query, currentTypeFilter);

            renderResults(results, query);
        }

        // Process text input events with timing control
        function handleSearch() {
            clearTimeout(searchTimeout);

            // Delay input handler for performance optimization
            searchTimeout = setTimeout(() => {
                visibleBooksLimit = 50; // Reset view parameters on update
                executeSearch();
            }, 300); // 300 milliseconds delay prevents UI freezing while typing
        }

        // Function triggered when clicking "Load More Books" button
        function loadMoreBooks() {
            visibleBooksLimit += 50; // Increase limit by 50
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            renderResults(lastFilteredData.length > 0 || query !== '' ? lastFilteredData : fairData, query);
        }

        function renderSchedule(scheduleStr) {
            if (!scheduleStr) return '';

            // Split multiple entries and trim whitespace
            const items = scheduleStr.split(',').map(s => s.trim());

            // Return inline if only one entry exists
            if (items.length === 1) {
                return ` ${safeValue(items[0])}`;
            }

            // Format multiple entries into individual lines
            return `<br>` + items.map(s => `<span class="block pl-2">${safeValue(s)}</span>`).join('');
        }

        // Render results into HTML structure with performance capping
        function renderResults(data, query = '') {
            const container = document.getElementById('resultsContainer');

            if (data.length === 0) {
                const emptyHtml = `
                    <div class="text-center py-12 bg-slate-800 rounded-xl shadow-sm border border-slate-700">
                        <p class="text-slate-400 text-lg">No s'ha trobat cap resultat per "${escapeHTML(query)}".</p>
                    </div>
                `;

                // Performance optimization: Render asynchronously via requestAnimationFrame
                requestAnimationFrame(() => {
                    container.innerHTML = emptyHtml;
                });
                return;
            }

            // Separate data into categories based on the 'type' field
            const allBooks = data.filter(item => item.type === 'book');
            const talks = data.filter(item => item.type === 'talk');
            const signings = data.filter(item => item.type === 'signing');

            // Performance optimization: Apply dynamic limit based on state
            const books = allBooks.slice(0, visibleBooksLimit);
            const hasMoreBooks = allBooks.length > visibleBooksLimit;

            let htmlContent = '';

            // Render Books Section if any
            if (books.length > 0) {
                htmlContent += `
                    <section>
                        <div class="flex justify-between items-center mb-3">
                            <h2 class="text-xl font-bold text-indigo-400 flex items-center gap-2">📚 Llibres</h2>
                            <span class="text-xs text-slate-400">Mostrant ${books.length} de ${allBooks.length}</span>
                        </div>
                        <div class="grid gap-4 sm:grid-cols-2">
                            ${books.map(book => `
                                <div class="bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-700 hover:border-indigo-500 transition-colors flex gap-4">
                                    <!-- Book Cover Image (conditionally rendered only if cover path exists) -->
                                    ${book.cover ? `
                                        <img 
                                            src="${safeValue(book.cover)}" 
                                            alt="Cover of ${safeValue(book.title)}" 
                                            class="w-24 h-36 object-cover rounded-lg shadow bg-slate-900 flex-shrink-0"
                                            loading="lazy"
                                            onerror="this.style.display='none'"
                                        >
                                    ` : ''}
                                    <!-- Book Info Container -->
                                    <div class="flex flex-col justify-between flex-grow">
                                        <div>
                                            <div class="flex justify-between items-start gap-2">
                                                <h3 class="font-bold text-lg text-white">${safeValue(book.title)}</h3>
                                                <span class="bg-indigo-950 text-indigo-300 text-xs font-semibold px-2 py-1 rounded border border-indigo-900">${safeValue(book.price)} €</span>
                                            </div>
                                            <p class="text-slate-300 font-medium cursor-pointer hover:text-indigo-400 mt-1" onclick="searchByAuthor('${book.author}')">Autor/a: <span class="underline">${safeValue(book.author)}</span></p>

                                            <div class="mt-3 text-sm text-slate-400 space-y-1 border-t border-slate-700/60 pt-2">
                                                ${book.publisher ? `<p><strong>Editorial:</strong> ${safeValue(book.publisher)}</p>` : ''}
                                                ${book.distributor ? `<p><strong>Distribuïdor:</strong> ${safeValue(book.distributor)}</p>` : ''}
                                                ${book.theme ? `<p><strong>Tema:</strong> ${safeValue(book.theme)}</p>` : ''}
                                                ${book.schedule ? `<p><strong>Horaris:</strong>${renderSchedule(book.schedule)}</p>` : ''}
                                            </div>
                                        </div>

                                        <div class="mt-4 pt-3 border-t border-slate-700/60 flex justify-between items-center text-xs text-slate-400">
                                            <span>EAN: ${safeValue(book.ean)}</span>
                                            <span class="bg-slate-900 px-2 py-1 rounded text-slate-300">Stock: <strong>${safeValue(book.quantity)}</strong></span>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        ${hasMoreBooks ? `
                            <div class="text-center mt-6">
                                <button onclick="loadMoreBooks()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-xl text-sm transition-colors shadow-sm cursor-pointer">
                                    Carregar més llibres (${allBooks.length - books.length} restants)...
                                </button>
                            </div>
                        ` : ''}
                    </section>
                `;
            }

            // Render Talks Section if any
            if (talks.length > 0) {
                htmlContent += `
                    <section class="mt-6">
                        <h2 class="text-xl font-bold text-teal-400 mb-3 flex items-center gap-2">🎤 Xerrades i Conferències</h2>
                        <div class="space-y-3">
                            ${talks.map(talk => `
                                <div class="bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-700 hover:border-teal-500 transition-colors flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                    <div>
                                        <h3 class="font-bold text-white">${safeValue(talk.title)}</h3>
                                        <p class="text-slate-300 text-sm cursor-pointer hover:text-teal-400" onclick="searchByAuthor('${talk.author}')">Ponent: <span class="underline font-medium">${safeValue(talk.author)}</span></p>
                                    </div>
                                    <div class="text-right text-sm bg-teal-950 text-teal-200 border border-teal-900 px-3 py-1.5 rounded-lg w-full sm:w-auto">
                                        <p>📍 ${safeValue(talk.location)}</p>
                                        <p class="font-semibold">📅 ${safeValue(talk.datetime)}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }

            // Render Signings Section if any
            if (signings.length > 0) {
                htmlContent += `
                    <section class="mt-6">
                        <h2 class="text-xl font-bold text-amber-400 mb-3 flex items-center gap-2">✍️ Sessions de Signatures</h2>
                        <div class="space-y-3">
                            ${signings.map(signing => `
                                <div class="bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-700 hover:border-amber-500 transition-colors flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                    <div>
                                        <h3 class="font-bold text-white">${safeValue(signing.title)}</h3>
                                        <p class="text-slate-300 text-sm cursor-pointer hover:text-amber-400" onclick="searchByAuthor('${signing.author}')">Autor/a: <span class="underline font-medium">${safeValue(signing.author)}</span></p>
                                    </div>
                                    <div class="text-right text-sm bg-amber-950 text-amber-200 border border-amber-900/50 px-3 py-1.5 rounded-lg w-full sm:w-auto">
                                        <p>📍 ${safeValue(signing.location)}</p>
                                        <p class="font-semibold">📅 ${safeValue(signing.datetime)}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }

            // Performance optimization: Push DOM mutation to the next repaint frame
            requestAnimationFrame(() => {
                container.innerHTML = htmlContent;
            });
        }

        // Quick helper when clicking on an author name to instantly filter everything related to them
        function searchByAuthor(authorName) {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = authorName;
            handleSearch();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
